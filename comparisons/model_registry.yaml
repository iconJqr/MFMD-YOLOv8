schema_version: 1

models:
  faster_rcnn:
    paper_name: Faster R-CNN
    family: two-stage CNN
    upstream_repository: not_recorded_in_release
    upstream_version_or_commit: not_recorded_in_release
    model_entrypoint: not_recorded_in_release
    optimizer: SGD (lr0=0.01, momentum=0.90, weight_decay=0.0005), as reported
    status: source_details_not_recorded
    paper_params_m: 41.5
    paper_gflops: 205.2
    note: The paper does not identify the backbone/FPN implementation; the original model configuration is needed to select the exact variant.

