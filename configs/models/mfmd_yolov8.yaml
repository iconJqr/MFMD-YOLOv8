# MFMD-YOLOv8: RCS-OSA + BRA. WIoU v3 is selected by the training configuration.
nc: 3
depth_multiple: 0.33
width_multiple: 0.25

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, RCSOSA, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, RCSOSA, [256]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, RCSOSA, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, RCSOSA, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  # n_win=7, heads=8, identity K/V sampling, hard non-differentiable routing,
  # four routed regions, local depthwise convolution=3, automatic padding.
  - [-1, 1, BiLevelRoutingAttention, [7, 8, null, null, 4, 4, null, identity, 4, qkvo, false, false, false, 3, true]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, RCSOSA, [512]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, RCSOSA, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, RCSOSA, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, RCSOSA, [1024]]
  - [[16, 19, 22], 1, Detect, [nc]]
