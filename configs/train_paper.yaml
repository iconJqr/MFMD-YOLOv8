# Shared training settings reported in the manuscript.
epochs: 300
patience: 50
batch: 8
imgsz: 640
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: true
amp: true
deterministic: true
assigner: task_aligned
box: 7.5
cls: 0.5
dfl: 1.5

# Offline augmentation was prepared once and reused. Disable online transforms.
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
close_mosaic: 0
